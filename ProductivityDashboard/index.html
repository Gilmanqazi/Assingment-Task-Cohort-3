<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productivity Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="shortcut icon" href="./assets/apple-touch-icon.png" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="main">
    <nav>
      <div class="theme">
      <h2>Productivity DashBoard</h2>
  <i class="ri-sun-line"></i>
</div>
    </nav>

<section class="allElems">

  <header>
  <div class="header1">
    <h2></h2>
    <h1></h1>
    <h4>Jalna (MH)</h4>
  </div>

   <div class="header2">
    <h2></h2>
    <h4>clear sky </h4>
    <h3 class="Pressure"></h3>
    <h3 class="Humidity"></h3>
    <h3 class="Wind"></h3>
  
  </div>
  </header>

<div class="allFeatures">
  <div class="todo elem" id="0">
    <img src="https://plus.unsplash.com/premium_photo-1681487870238-4a2dfddc6bcb?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8dG9kbyUyMGxpc3R8ZW58MHx8MHx8fDA%3D" alt="">
    <h2>To Do List</h2>
  </div>
  <div class="daily elem" id="1">
    <img src="https://images.unsplash.com/photo-1601342630314-8427c38bf5e6?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8ZGFpbHlQbGFubmVyfGVufDB8fDB8fHww" alt="">
  <h2>Daily Planner</h2>
  </div>
  <div class="moti elem" id="2">
    <img src="https://plus.unsplash.com/premium_photo-1671512499810-ac5b5dd3bc2b?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTd8fE1vdGl2YXRpb258ZW58MHx8MHx8fDA%3D" alt="">
  <h2>Motivation</h2>
  </div>
  <div class="pomo elem" id="3">
    <img src="https://images.unsplash.com/photo-1664994817539-8a865f12dc6c?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8cG9tb2Rvcm8lMjB0aW1lcnxlbnwwfHwwfHx8MA%3D%3D" alt="">
  <h2>Pomodoro Timer</h2>
  </div>
  <div class="goals elem" id="4">
    <img src="https://plus.unsplash.com/premium_photo-1672787617291-c28a70868ee0?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTN8fGRhaWx5JTIwZ29hbHxlbnwwfHwwfHx8MA%3D%3D" alt="">
  <h2>Daily Goals</h2>
  </div>
</div>

</section>


<section class="fullElem todo-list-fullpage">
  <button class="back" id="0">Close</button>
<h2>Your personalized Task List</h2>

<div class="todo-container">
  <div class="addTask">
    <form>
      <input id="task-input" type="text" placeholder="Enter Task" required>
      <textarea placeholder="Enter Details" name="" id="" cols="20" rows="20" required></textarea>

      <div class="mark-imp">
        <input type="checkbox"  id="check">
        <label for="check">Mark as Important!</label>
       
      </div>

      <button>Add Task</button>
    </form>
  </div>

  <div class="allTask">

  </div>



</div>
</section>


<section class="fullElem daily-planner-fullpage">
  <button class="back" id="1">Close</button>
<h2>Plan your Day To Be More Productive</h2>
<div class="day-planner">


</div>
</section>


<section class="fullElem motivational-fullpage">
  <button class="back" id="2">Close</button>
  <div class="motivation-container">
<div class="motivation-wrapper">
  <div class="motivation-1">
    <h2>Quote of the Day</h2>
  </div>
  <button id="quoteBtn">New Quote</button>
  <div class="motivation-2">
<h1></h1>
  </div>

  <div class="motivation-3">
    <h2></h2>
      </div>

</div>
  </div>
</section>


<section class="fullElem pomodoro-fullpage">
  <button class="back" id="3">Close</button>
  <h2>Study with me!</h2>

  <h4 class="session" style="background-color: var(--green);">
    Work Session
  </h4>
  
  <div class="pomo-timer">
    <h1>25:00</h1>
    <div class="btn-group">
      <button class="start-timer">Start</button>
      <button class="pause-timer">Pause</button>
      <button class="reset-timer">Reset</button>
    </div>
  </div>
</section>



<section class="fullElem daily-goals-fullpage">
  <button class="back" id="4">Close</button>

  <h1>Daily Goals</h1>

  <div class="goal-list">

    <div class="goal">
      <input type="checkbox" id="goal1">
    
    </div>

  </div>

  <div class="progress">
    <p>Completed: <span>0/5</span></p>
    <progress value="0" max="5"></progress>
  </div>

  <button class="add-goal">+ Add Goal</button>
</section>
  </div>
  

  <script src="script.js"></script>
</body>
</html>
