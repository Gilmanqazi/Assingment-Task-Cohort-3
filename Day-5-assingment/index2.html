<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Insights & Blogs UI</title>

  <link rel="stylesheet" href="style2.css">
</head>
<body>

  <div class="container">



    <header class="navbar">

      <div class="logo">
        <div class="logo-icon"></div>
        <span>ScaleX</span>
      </div>

      <nav class="nav-links">
        <a href="#">Home</a>
        <a href="#">About Us</a>
        <a href="#">Blogs</a>
        <a href="#">Contact Us</a>
      </nav>

      <button class="btn">Get Started</button>

    </header>

  

    <section class="hero">
      <h1>Insights & Blogs</h1>

      <button class="filter-btn">Tech</button>

    <section class="cards">

   

      <div class="card">

        <div class="card-image">

        <div class="card-content">

            The Ultimate Guide To SaaS Marketing

      </div>



      <div class="card">

        </div>

        <div class="card-content">

          <span class="tag">SaaS</span>

          <h2>
            5 Key Trends In SaaS Growth For 2025
          </h2>

          <p class="date">May 23, 2025</p>

        </div>

      </div>

    

      <div class="card">

        <div class="card-image">
          <img src="https://images.unsplash.com/photo-1519052537078-e6302a4968d4?q=80&w=1200&auto=format&fit=crop" alt="">
        </div>

        <div class="card-content">

          <span class="tag">Marketing</span>

          <h2>
            How Data-Driven Strategies Are Important
          </h2>

          <p class="date">May 23, 2025</p>
