<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Insect UI</title>
<link rel="stylesheet" href="style.css">
<link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>

  <div class="container">

    <!-- SPLIT BACKGROUND -->
    <div class="left-panel"></div>
    <div class="right-panel"></div>

    <!-- NAVBAR -->
    <header class="navbar">

      <div class="logo">INSECT</div>

      <div class="search-box">
        <span class="search-icon"><i class="ri-search-line"></i></span>
        <input type="text" placeholder="Search...">
      </div>

      <nav class="nav-links">
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">About</a>
        <a href="#">Gallery</a>
        <a href="#">Contact</a>
      </nav>

    </header>

    <!-- MAIN CONTENT -->
    <div class="content">

      <!-- LEFT SIDE -->
      <div class="left-content">

        <h1 class="vertical-text">Classification</h1>

        <div class="details">

          <div class="item">
            <div class="dot">•</div>
            <div>
              <strong>Class:</strong>
              <p>Insecta</p>
            </div>
          </div>

          <div class="item">
            <div class="dot">•</div>
            <div>
              <strong>Order:</strong>
              <p>Coleoptera</p>
            </div>
          </div>

          <div class="item">
            <div class="dot">•</div>
            <div>
              <strong>Family:</strong>
              <p>Cerambycidae</p>
            </div>
          </div>

          <div class="item">
            <div class="dot">•</div>
            <div>
              <strong>Sub-Family:</strong>
              <p>Cerambycinae</p>
            </div>
          </div>

          <div class="item">
            <div class="dot">•</div>
            <div>
              <strong>Tribe:</strong>
              <p>Callicromatini</p>
            </div>
          </div>

          <div class="item">
            <div class="dot">•</div>
            <div>
              <strong>Genus:</strong>
              <p>Pachyteria</p>
            </div>
          </div>

        </div>

      </div>

      <!-- RIGHT SIDE -->
      <div class="right-content">

        <h2 class="title">
          Pachyteria<br>
          equestris
        </h2>

        <div class="meta-wrapper">

          <div class="left-meta">
            <div class="bug-icon">🪲</div>
            <div class="measure">32 mm</div>
          </div>

          <div class="meta-right">

            <div class="meta">
              <i class="ri-map-pin-2-line"></i>
              <div>
                <span>Locality:</span>
                <strong>Malaysia</strong>
              </div>
            </div>

            <div class="meta">
              <i class="ri-men-line"></i>
              <div>
                <span>Sex:</span>
                <strong>Male</strong>
              </div>
            </div>

            <div class="meta">
              <i class="ri-ruler-line"></i>
              <div>
                <span>Size:</span>
                <strong>32 mm / 12 mm</strong>
              </div>
            </div>

          </div>

        </div>

        <div class="price">$5.99</div>

        <div class="switches">

          <label class="switch-row">
            <input type="checkbox">
            <div class="slider"></div>
            <span>View detailed antennae</span>
          </label>

          <label class="switch-row">
            <input type="checkbox">
            <div class="slider"></div>
            <span>View underside</span>
          </label>

        </div>

        <button class="btn">Add to collection</button>

      </div>

    </div>

    <!-- CENTER COCKROACH IMAGE -->
    <div class="middle-image">
      <img src="cockroach img-removebg.png" alt="cockroach insect">
    </div>

  </div>

</body>
</html>
