<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Squid Game UI</title>

 
  <link rel="stylesheet" href="style1.css">

 
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="container">


    <header class="navbar">

      <div class="logo">
       <img src="https://pngimg.com/uploads/squid_game/squid_game_PNG35.png" alt="logo">
      </div>

      <nav class="nav-links">
        <a href="#">About</a>
        <a href="#" class="active">Watch now</a>
        <a href="#">Actors</a>
        <a href="#">Contact</a>
      </nav>

      <div class="menu-icon">
        <i class="fa-solid fa-bars"></i>
      </div>

    </header>

    

    <div class="main-content">

   

      <div class="left-content">

<div class="main-text">

  <img src="https://pngimg.com/uploads/squid_game/squid_game_PNG35.png" alt="">

</div>

        <p>
          Action / Thriller / Drama Series directed by Dong-hyuk Hwang <br>
          Season 1: 9 Episodes
        </p>

        

        <div class="buttons">

          <button class="play-btn">
            <i class="fa-solid fa-circle-play"></i>
            Play Now
          </button>

          <button class="trailer-btn">
            <i class="fa-regular fa-circle-play"></i>
            Watch Trailer
          </button>

        </div>

      </div>

      

      <div class="scroll-text">
        SCROLL
        <div class="line"></div>
      </div>

      

      <div class="right-content">

        <img src="download (1).png"
        alt="Squid Game Guard">

      </div>

      

      <div class="social-icons">

        <i class="fa-brands fa-twitter"></i>
        <i class="fa-brands fa-instagram"></i>
        <i class="fa-brands fa-facebook-f"></i>

      </div>

     

      <div class="big-text">
        GAME
      </div>

    </div>

  

    <div class="bottom-cards">

    

      <div class="card">

        <img src="squad3.png" alt="">

        <div class="play-icon">
          <i class="fa-solid fa-play"></i>
        </div>

      </div>

     

      <div class="card">

        <img src="squaddd.png" alt="">

        <div class="play-icon">
          <i class="fa-solid fa-play"></i>
        </div>

      </div>



      <div class="card">

        <img src="squad3.png" alt="">

        <div class="play-icon">
          <i class="fa-solid fa-play"></i>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
