<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KharchaPaani | Register</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme:{
                extend:{
                    fontFamily:{
                        poppins:["Poppins","sans-serif"]
                    },
                    colors: {
                        space: {
                            900: '#0B0F19',
                            800: '#111827',
                            700: '#1F2937'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="font-poppins bg-space-900 text-slate-100 min-h-screen flex items-center justify-center px-4 relative overflow-hidden">

    <!-- Ambient Neon Background Glows aligned with Login Page -->
    <div class="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] rounded-full bg-gradient-to-br from-rose-600/10 to-transparent blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-25%] right-[-10%] w-[600px] h-[600px] rounded-full bg-gradient-to-tl from-purple-600/10 to-transparent blur-[150px] pointer-events-none"></div>

    <!-- Main Container -->
    <div class="w-full max-w-lg bg-space-800/40 backdrop-blur-xl rounded-3xl border border-slate-800 shadow-[0_0_50px_rgba(0,0,0,0.3)] p-8 sm:p-10 relative z-10">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-rose-600 to-rose-400 bg-clip-text text-transparent">
                Create Account
            </h1>
            <p class="text-xs text-slate-500 font-medium tracking-wide mt-1.5 uppercase">
                Start Managing Your Gareebi Today
            </p>
        </div>

        <!-- Form Element -->
        <form id="registerForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold tracking-wider text-slate-400 uppercase mb-2">
                    Full Name
                </label>
                <input
                    id="name"
                    type="text"
                    required
                    placeholder="E.g., Gilman"
                    class="w-full bg-space-900/60 border border-slate-800 rounded-xl p-3.5 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-rose-600/50 focus:ring-1 focus:ring-rose-600/50 transition duration-200">
            </div>

            <div>
                <label class="block text-xs font-semibold tracking-wider text-slate-400 uppercase mb-2">
                    Email Address
                </label>
                <input
                    id="email"
                    type="email"
                    required
                    placeholder="naam@domain.com"
                    class="w-full bg-space-900/60 border border-slate-800 rounded-xl p-3.5 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-rose-600/50 focus:ring-1 focus:ring-rose-600/50 transition duration-200">
            </div>

            <div>
                <label class="block text-xs font-semibold tracking-wider text-slate-400 uppercase mb-2">
                    Password
                </label>
                <input
                    id="password"
                    type="password"
                    required
                    placeholder="••••••••"
                    class="w-full bg-space-900/60 border border-slate-800 rounded-xl p-3.5 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-rose-600/50 focus:ring-1 focus:ring-rose-600/50 transition duration-200">
            </div>

            <div>
                <label class="block text-xs font-semibold tracking-wider text-slate-400 uppercase mb-2">
                    Confirm Password
                </label>
                <input
                    id="confirmPassword"
                    type="password"
                    required
                    placeholder="••••••••"
                    class="w-full bg-space-900/60 border border-slate-800 rounded-xl p-3.5 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-rose-600/50 focus:ring-1 focus:ring-rose-600/50 transition duration-200">
            </div>

            <button
                type="submit"
                class="w-full relative mt-4 group overflow-hidden rounded-xl p-3.5 font-semibold text-white bg-gradient-to-r from-black via-purple-950 to-rose-950 border border-slate-800 shadow-md hover:border-rose-600/30 transition-all duration-300">
                <span class="absolute inset-0 w-full h-full bg-white/5 opacity-0 group-hover:opacity-100 transition duration-300"></span>
                <span class="relative z-10">Sign Up & Track Mistakes</span>
            </button>
        </form>

        <!-- Footer link back to login -->
        <p class="text-center mt-8 text-sm text-slate-500">
            Already part of the tragedy? 
            <a href="login.html" class="text-rose-600 font-semibold hover:underline ml-1">
                Login here
            </a>
        </p>
    </div>

</body>
<script src="auth.js"></script>
</html>
