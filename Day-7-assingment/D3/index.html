<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jon Daniel | Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <div class="sidebar">
        <span>Podcast</span>
        <span>Portfolio</span>
        <span>Research</span>
        <span>Clients</span>
    </div>

    <div class="portfolio-grid">

       
        <div class="card profile-card">
            <div class="about-me-box">
                <span style="font-size:19px;">❃</span> 
                About Me
            </div>

            <div class="profile-circle-wrap">
                <img src="https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTh8fHByb2ZpbGV8ZW58MHx8MHx8fDA%3D" alt="Caser Rincon">
            </div>

            <div class="profile-info">
                <h1>Im,<br>Caser Rincon</h1>
                <p class="email">inquiry@CaserRincon.design <span>✉</span></p>
            </div>

            <div class="badge-disk">
                <div class="disk-text">
                    MY DESIGN<br>
                    PORTFOLIO<br>
                    2026
                </div>
            </div>
        </div>

       
        <div class="header">
            <h1>Portfolio<span class="arrow">↗</span></h1>
        </div>

     
        <div class="card flamingo-card">
            <img src="https://picsum.photos/id/1015/900/700" alt="Flamingo">
            <div class="play-overlay">▶</div>
            <div class="corner">⌝</div>
        </div>

        
        <div class="stats-stack">
            <div class="card stat-box mint">
                <div class="corner">⌝</div>
                <h2>251</h2>
                <p>Projects</p>
            </div>
            <div class="card stat-box purple">
                <div class="corner">⌝</div>
                <h2>156</h2>
                <p>Awards</p>
            </div>
        </div>

       
        <div class="card clients-card">
            <div class="corner">⌝</div>
            <img src="https://images.unsplash.com/photo-1621768216002-5ac171876625?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8YXBwbGUlMjBsb2dvfGVufDB8fDB8fHww" alt="Apple">
            <p>Clients</p>
        </div>

      
        <div class="card awards-card">
            <div class="sphere">
                <img src="https://picsum.photos/id/1016/500/400" alt="Sphere">
            </div>
            <div class="orange-box">
                <div class="corner">⌝</div>
                <h2>172</h2>
                <p>Global Design<br>Awards.</p>
            </div>
        </div>

    </div>

</body>
</html>
